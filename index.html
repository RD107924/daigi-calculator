<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>代採購費用計算器</title>
    <link rel="icon" href="logo.png" type="image/png" />
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background-color: #f0f2f5;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px 0;
        color: #333;
        box-sizing: border-box;
      }
      .container {
        width: 100%;
        max-width: 420px;
        text-align: center;
      }
      /* --- Logo 樣式 --- */
      .logo-container {
        margin-bottom: 20px;
      }
      .logo {
        max-width: 150px; /* 您可以在這裡調整 Logo 的大小 */
        height: auto;
      }
      .calculator-container {
        background-color: #ffffff;
        padding: 30px 40px;
        border-radius: 12px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
        box-sizing: border-box;
        margin-bottom: 20px;
      }
      h1 {
        color: #1c1e21;
        margin-bottom: 10px;
        font-size: 1.8rem;
      }
      p.description {
        color: #606770;
        margin-bottom: 20px;
        font-size: 0.95rem;
      }
      .formula-display {
        background-color: #f8f9fa;
        border: 1px solid #e9ecef;
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 25px;
        font-size: 0.9rem;
        text-align: left;
      }
      .formula-display strong {
        display: block;
        margin-bottom: 5px;
        color: #333;
        font-size: 0.95rem;
      }
      .formula-display span {
        color: #555;
      }
      .input-group {
        margin-bottom: 20px;
      }
      label {
        display: block;
        text-align: left;
        margin-bottom: 8px;
        font-weight: 600;
        color: #4b4f56;
      }
      input[type="number"] {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccd0d5;
        border-radius: 8px;
        font-size: 1.1rem;
        box-sizing: border-box;
        -moz-appearance: textfield;
      }
      input::-webkit-outer-spin-button,
      input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      button {
        width: 100%;
        padding: 12px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 1.1rem;
        font-weight: bold;
        cursor: pointer;
        transition: background-color 0.3s ease;
      }
      button:hover {
        background-color: #0056b3;
      }
      #result {
        margin-top: 25px;
        padding: 15px;
        background-color: #fff9e6;
        border-radius: 8px;
        border: 1px solid #ffeeba;
        min-height: 90px;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
      }
      #result .total-price {
        font-size: 1.3rem;
        font-weight: bold;
        color: #d9534f;
      }
      #result .breakdown {
        font-size: 0.85rem;
        font-weight: normal;
        color: #606770;
        margin-top: 5px;
      }
      #result .calculation-steps {
        font-size: 0.8rem;
        font-weight: normal;
        color: #888;
        margin-top: 8px;
        font-family: monospace;
      }
      .invoice-notice {
        font-size: 0.8rem;
        font-weight: bold;
        color: #007bff;
        margin-top: 10px;
      }
      .links-container {
        background-color: #ffffff;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      }
      .links-container h2 {
        font-size: 1.1rem;
        color: #333;
        margin-top: 0;
        margin-bottom: 15px;
        border-bottom: 1px solid #eee;
        padding-bottom: 10px;
      }
      .link-button {
        display: block;
        background-color: #28a745; /* 預設綠色 */
        color: white;
        padding: 12px;
        margin-bottom: 10px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
        transition: background-color 0.3s ease;
      }
      .link-button:hover {
        background-color: #218838;
      }
      .app-links {
        display: flex;
        justify-content: space-between;
        gap: 10px;
      }
      .app-links .link-button {
        flex: 1;
        background-color: #17a2b8;
      }
      .app-links .link-button:hover {
        background-color: #138496;
      }
      .link-button.calculator-pro {
        background-color: #17a2b8; /* 水藍色 */
      }
      .link-button.calculator-pro:hover {
        background-color: #138496;
      }

      footer {
        margin-top: 30px;
        font-size: 0.85rem;
        color: #888;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="logo-container">
        <img src="logo.png" alt="跑跑虎&小跑豬 Logo" class="logo" />
      </div>

      <div class="calculator-container">
        <h1>代採購費用計算器</h1>
        <p class="description">輸入商品人民幣價格，為您計算台幣總價。</p>

        <div class="formula-display">
          <strong>計價方式</strong>
          <span>(商品人民幣價格 × 4.5 匯率) + 20% 服務費</span>
        </div>

        <div class="input-group">
          <label for="rmbPrice">人民幣價格 (CNY)</label>
          <input type="number" id="rmbPrice" placeholder="例如: 100" />
        </div>

        <button onclick="calculate()">計算總價</button>

        <div id="result">請輸入金額後點擊按鈕</div>
      </div>

      <div class="links-container">
        <h2>跑跑虎集運</h2>
        <a href="https://lin.ee/1VF9T5G" target="_blank" class="link-button"
          >LINE 客服</a
        >
        <p
          style="
            font-size: 0.9rem;
            color: #555;
            margin-top: 0px;
            margin-bottom: 10px;
          "
        >
          APP 下載
        </p>
        <div class="app-links">
          <a href="https://reurl.cc/koE57x" target="_blank" class="link-button"
            >iOS 系統</a
          >
          <a href="https://reurl.cc/rYRlDx" target="_blank" class="link-button"
            >Android 系統</a
          >
        </div>
      </div>

      <div class="links-container" style="margin-top: 15px">
        <h2>小跑豬傢俱專線</h2>
        <a href="https://lin.ee/RLESzAm" target="_blank" class="link-button"
          >LINE 客服</a
        >
        <a
          href="https://piggy-calculator-pro.onrender.com/"
          target="_blank"
          class="link-button calculator-pro"
          >專業版傢俱運費試算器</a
        >
      </div>

      <footer>
        <p>本頁面由 跑跑虎 & 小跑豬代採購 開發</p>
      </footer>
    </div>

    <script>
      function calculate() {
        const rmbPriceInput = document.getElementById("rmbPrice");
        const resultDiv = document.getElementById("result");
        const rmbPrice = parseFloat(rmbPriceInput.value);

        if (isNaN(rmbPrice) || rmbPrice <= 0) {
          resultDiv.innerHTML = "請輸入有效的金額";
          return;
        }

        const exchangeRate = 4.5;
        const serviceFeeRate = 0.2;

        const twdPrice = rmbPrice * exchangeRate;
        const serviceFee = twdPrice * serviceFeeRate;
        const totalTwdPrice = twdPrice + serviceFee;

        resultDiv.innerHTML = `
                <div class="total-price">預估總金額: TWD $${Math.round(
                  totalTwdPrice
                )}</div>
                <div class="breakdown">(商品台幣 $${Math.round(
                  twdPrice
                )} + 服務費 $${Math.round(serviceFee)})</div>
                <div class="calculation-steps">
                    計算明細: (${rmbPrice} × ${exchangeRate}) + (${Math.round(
          twdPrice
        )} × ${serviceFeeRate})
                </div>
                <div class="invoice-notice">代採購金額一律開立電子發票</div>
              `;
      }
    </script>
  </body>
</html>
